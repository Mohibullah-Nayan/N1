<!doctype html>
<html lang="bn" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - SCENT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-[#0B0F19] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-[#F26522] selection:text-white">
    <!-- Ambient Background Glows -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-600/15 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/15 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/5 rounded-full blur-[160px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
      <!-- ব্রান্ড হেডার -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2.5 mb-3 group">
          <span class="w-3.5 h-3.5 rounded-full bg-gradient-to-r from-[#F26522] to-amber-400 inline-block animate-pulse shadow-lg shadow-orange-500/50"></span>
          <span class="text-2xl font-black tracking-widest text-white">SCENT <span class="bg-gradient-to-r from-[#F26522] to-amber-400 bg-clip-text text-transparent">ATELIER</span></span>
        </div>
        <p class="text-xs uppercase tracking-widest font-bold text-slate-400">Admin Control Center &bull; Able Pro Edition</p>
      </div>

      <!-- লগইন কার্ড -->
      <div class="bg-slate-900/80 backdrop-blur-2xl border border-slate-800/90 rounded-3xl p-7 sm:p-9 shadow-2xl relative overflow-hidden border-t-4 border-t-[#F26522]">
        
        <div class="mb-6">
          <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">Admin Authorization</h2>
          <p class="text-xs text-slate-400 mt-1 font-medium">Please sign in with verified administrative credentials.</p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
          <!-- ইমেইল ফিল্ড -->
          <div>
            <label for="adminEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-envelope text-[#F26522]"></i> Admin Email
            </label>
            <div class="relative">
              <input
                type="email"
                id="adminEmail"
                placeholder="admin@example.com"
                required
                class="w-full bg-slate-950/70 border border-slate-800 text-white text-sm font-medium rounded-xl px-4 py-3 placeholder:text-slate-600 focus:outline-none focus:border-[#F26522] focus:ring-4 focus:ring-orange-500/10 transition shadow-inner"
              />
            </div>
          </div>

          <!-- পাসওয়ার্ড ফিল্ড -->
          <div>
            <label for="adminPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-lock text-[#F26522]"></i> Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="adminPassword"
                placeholder="••••••••"
                required
                class="w-full bg-slate-950/70 border border-slate-800 text-white text-sm font-medium rounded-xl px-4 py-3 placeholder:text-slate-600 focus:outline-none focus:border-[#F26522] focus:ring-4 focus:ring-orange-500/10 transition shadow-inner"
              />
            </div>
          </div>

          <!-- সিকিউরিটি ইনফো -->
          <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
            <span class="flex items-center gap-1.5 font-medium">
              <i class="fa-solid fa-shield-halved text-emerald-400"></i> End-to-end encrypted
            </span>
            <span class="text-[11px] text-slate-500 font-mono">256-bit AES</span>
          </div>

          <!-- সাবমিট বাটন -->
          <button
            type="submit"
            class="login-btn w-full mt-2 py-3.5 px-6 rounded-xl bg-gradient-to-r from-[#F26522] via-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold text-sm shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all cursor-pointer flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Secure Login</span>
          </button>

          <!-- মেসেজ ও স্ট্যাটাস ডিসপ্লে -->
          <div id="message" class="message text-center text-xs font-semibold pt-2 min-h-[22px] transition-all"></div>
        </form>

        <!-- ব্যাক লিঙ্ক -->
        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
          <a
            href="login.html"
            class="inline-flex items-center gap-2 text-xs font-semibold text-slate-400 hover:text-[#F26522] transition-colors"
          >
            <i class="fa-solid fa-arrow-left"></i> Return to Customer Login
          </a>
        </div>
      </div>
    </div>

    <!-- Firebase SDKs (Remained Unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyD6TSzBthiUw_HkKfBc3hkQnw_mQEs8FZU",
        authDomain: "nayan-bc068.firebaseapp.com",
        projectId: "nayan-bc068",
        storageBucket: "nayan-bc068.firebasestorage.app",
        messagingSenderId: "782323259018",
        appId: "1:782323259018:web:a428fe0d96897711223f73",
        measurementId: "G-8PJVBLSPZV",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      const auth = firebase.auth();
      const db = firebase.firestore();

      // Admin Login Logic
      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("adminEmail").value.trim();
          const password = document.getElementById("adminPassword").value;
          const message = document.getElementById("message");

          message.style.color = "#94a3b8";
          message.textContent = "Authenticating with Firebase... please wait.";

          const loginBtn = document.querySelector(".login-btn");
          loginBtn.disabled = true;
          loginBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

          try {
            const userCredential = await auth.signInWithEmailAndPassword(
              email,
              password,
            );
            const user = userCredential.user;

            const userDoc = await db.collection("users").doc(user.uid).get();

            if (!userDoc.exists) {
              message.style.color = "#fb7185";
              message.textContent = "Access denied: Admin record not found.";
              await auth.signOut();
              return;
            }

            const userData = userDoc.data();
            if (userData.role !== "admin") {
              message.style.color = "#fb7185";
              message.textContent = "Access denied: Unauthorized role.";
              await auth.signOut();
              return;
            }

            message.style.color = "#34d399";
            message.textContent = "✓ Access granted! Redirecting to Dashboard...";

            setTimeout(() => {
              window.location.href = "admin.html";
            }, 600);
          } catch (error) {
            console.error("Admin login error:", error);
            message.style.color = "#fb7185";

            if (
              error.code === "auth/invalid-credential" ||
              error.code === "auth/wrong-password" ||
              error.code === "auth/user-not-found"
            ) {
              message.textContent = "Invalid administrator email or password.";
            } else {
              message.textContent = error.message;
            }
          } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML =
              '<i class="fa-solid fa-right-to-bracket"></i> <span>Secure Login</span>';
          }
        });
    </script>
  </body>
</html>

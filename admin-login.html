<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Admin Login | Dashboard</title>
    <!-- Google Fonts - Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0a0f1a;
        position: relative;
        overflow: hidden;
        padding: 20px;
      }

      /* Background Decorative Elements */
      body::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: #f26522;
        filter: blur(150px);
        opacity: 0.15;
        border-radius: 50%;
        top: -100px;
        left: -100px;
        z-index: -1;
      }
      body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: #22c1f2;
        filter: blur(150px);
        opacity: 0.1;
        border-radius: 50%;
        bottom: -100px;
        right: -100px;
        z-index: -1;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
      }

      .login-box {
        background: rgba(
          25,
          25,
          25,
          0.6
        ); /* Semi-transparent dark background */
        backdrop-filter: blur(20px); /* Glassmorphism Effect */
        -webkit-backdrop-filter: blur(20px);
        padding: 50px 40px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      /* Decorative Top Line */
      .login-box::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #f26522, #d95417);
      }

      .login-box h2 {
        text-align: center;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .login-box .subtitle {
        text-align: center;
        color: #999;
        margin-bottom: 40px;
        font-size: 14px;
        font-weight: 300;
      }

      .form-group {
        margin-bottom: 25px;
        position: relative;
      }

      .form-group label {
        display: block;
        color: #ddd;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        transition: all 0.3s;
      }

      .form-group input {
        width: 100%;
        padding: 15px 20px 15px 45px; /* Added left padding for icon */
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        outline: none;
        font-size: 15px;
        color: #fff;
        transition: all 0.3s ease;
      }

      /* Input Icons */
      .form-group i {
        position: absolute;
        left: 18px;
        top: 45px; /* Aligned with input center */
        color: #777;
        font-size: 16px;
        transition: all 0.3s;
      }

      /* Focus Effects */
      .form-group input:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: #f26522;
        box-shadow: 0 0 15px rgba(242, 101, 34, 0.2);
      }

      .form-group input:focus + i {
        color: #f26522;
      }

      .login-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #f26522, #d95417);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 5px 15px rgba(242, 101, 34, 0.3);
      }

      .login-btn:hover {
        background: linear-gradient(90deg, #d95417, #c04a14);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(242, 101, 34, 0.4);
      }

      .login-btn:active {
        transform: translateY(1px);
      }

      .message {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        min-height: 18px; /* Prevents jumping */
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 30px;
        color: #888;
        text-decoration: none;
        font-size: 13px;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .back-link:hover {
        color: #f26522;
      }

      /* Responsive Adjustments */
      @media (max-width: 480px) {
        .login-box {
          padding: 40px 30px;
        }
        .login-box h2 {
          font-size: 24px;
        }
        .login-box .subtitle {
          margin-bottom: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-box">
        <h2>Admin Portal</h2>
        <p class="subtitle">Welcome back! Please login to continue.</p>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminEmail">Email Address</label>
            <input
              type="email"
              id="adminEmail"
              placeholder="admin@example.com"
              required
            />
            <i class="fas fa-envelope"></i>
          </div>

          <div class="form-group">
            <label for="adminPassword">Password</label>
            <input
              type="password"
              id="adminPassword"
              placeholder="••••••••"
              required
            />
            <i class="fas fa-lock"></i>
          </div>

          <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt me-2"></i> Secure Login
          </button>

          <div id="message" class="message"></div>
        </form>

        <a href="login.html" class="back-link">
          <i class="fas fa-arrow-left"></i> Back to Customer Login
        </a>
      </div>
    </div>

    <!-- Firebase SDKs (Remained Unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
      // Firebase Configuration (আপনার আগের কোড থেকেই নেওয়া)
      const firebaseConfig = {
        apiKey: "AIzaSyD6TSzBthiUw_HkKfBc3hkQnw_mQEs8FZU",
        authDomain: "nayan-bc068.firebaseapp.com",
        projectId: "nayan-bc068",
        storageBucket: "nayan-bc068.firebasestorage.app",
        messagingSenderId: "782323259018",
        appId: "1:782323259018:web:a428fe0d96897711223f73",
        measurementId: "G-8PJVBLSPZV",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      const auth = firebase.auth();
      const db = firebase.firestore();

      // Admin Login Logic (আপনার আগের কোডটিই ব্যবহার করা হয়েছে, শুধু মেসেজের কালার আপডেট করা হয়েছে)
      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("adminEmail").value.trim();
          const password = document.getElementById("adminPassword").value;
          const message = document.getElementById("message");

          // Updated colors for better look in dark theme
          message.style.color = "#aaa";
          message.textContent = "Authenticating... please wait.";

          // Disable button while loading
          const loginBtn = document.querySelector(".login-btn");
          loginBtn.disabled = true;
          loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Logging in...';

          try {
            const userCredential = await auth.signInWithEmailAndPassword(
              email,
              password,
            );
            const user = userCredential.user;

            const userDoc = await db.collection("users").doc(user.uid).get();

            if (!userDoc.exists) {
              message.style.color = "#ff4b4b"; /* Lighter red for errors */
              message.textContent = "Access denied. Admin account not found.";
              await auth.signOut();
              return;
            }

            const userData = userDoc.data();
            if (userData.role !== "admin") {
              message.style.color = "#ff4b4b";
              message.textContent = "Access denied. Admins only.";
              await auth.signOut();
              return;
            }

            message.style.color = "#00e676"; /* Bright green for success */
            message.textContent = "Login successful! Redirecting...";

            setTimeout(() => {
              window.location.href = "admin.html";
            }, 700);
          } catch (error) {
            console.error("Admin login error:", error);
            message.style.color = "#ff4b4b";

            if (
              error.code === "auth/invalid-credential" ||
              error.code === "auth/wrong-password" ||
              error.code === "auth/user-not-found"
            ) {
              message.textContent = "Invalid email or password.";
            } else {
              message.textContent = error.message;
            }
          } finally {
            // Re-enable button in case of error
            loginBtn.disabled = false;
            loginBtn.innerHTML =
              '<i class="fas fa-sign-in-alt me-2"></i> Secure Login';
          }
        });
    </script>
  </body>
</html>

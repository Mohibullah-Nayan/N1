    <!-- Instant Theme & Language Auto Sync (Prevents FOUC on all devices) -->
    <script>
      (function(){try{const t=localStorage.getItem('theme');const d=t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}const l=localStorage.getItem('scent-language')||'en';document.documentElement.lang=l==='bn'?'bn':'en';}catch(e){}})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<!-- External CSS Link -->
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Hind Siliguri', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: '#D97706',
                        darkBg: '#090D16'
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
        }

        .dark .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
        }

        /* Rotating Radar Sweep */
        @keyframes radarSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar-sweep {
            animation: radarSpin 5s linear infinite;
        }

        /* 3D Highway Road Dashes */
        .animated-road-stripes {
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.35) 0, rgba(255, 255, 255, 0.35) 14px, transparent 14px, transparent 28px);
            background-size: 56px 100%;
            animation: moveRoad 0.75s linear infinite;
        }

        @keyframes moveRoad {
            0% { background-position: 0 0; }
            100% { background-position: 56px 0; }
        }

        /* Vehicle Rumble & Suspension Motion */
        @keyframes vehicleDrive {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-2px) rotate(0.8deg); }
            75% { transform: translateY(-1px) rotate(-0.5deg); }
        }
        .animate-vehicle-drive {
            animation: vehicleDrive 0.35s ease-in-out infinite;
        }

        /* Headlight Light Cone */
        .headlight-beam-cone {
            position: absolute;
            right: -38px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 28px;
            background: radial-gradient(ellipse at left, rgba(251, 191, 36, 0.85) 0%, rgba(245, 158, 11, 0.35) 50%, transparent 80%);
            filter: blur(1.5px);
            pointer-events: none;
        }

        /* Continuous Demo Road Preview */
        @keyframes continuousTravel {
            0% { transform: translateX(0%); }
            48% { transform: translateX(calc(100% - 36px)) scaleX(1); }
            50% { transform: translateX(calc(100% - 36px)) scaleX(-1); }
            98% { transform: translateX(0%) scaleX(-1); }
            100% { transform: translateX(0%) scaleX(1); }
        }
        .preview-traveling-truck {
            animation: continuousTravel 7s ease-in-out infinite;
            width: fit-content;
        }

        /* Golden Sparkle Shimmer */
        @keyframes sparkleGlow {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .animate-sparkle {
            animation: sparkleGlow 1.8s ease-in-out infinite;
        }

        /* Pulsing Station Rings */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(242, 101, 34, 0.6); }
            50% { box-shadow: 0 0 0 10px rgba(242, 101, 34, 0); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 1.8s infinite;
        }

        /* Floating Package Badge Animation */
        @keyframes floatParcel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float-parcel {
            animation: floatParcel 2s ease-in-out infinite;
        }
    </style>

<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- Instant Theme & Language Auto Sync (Prevents FOUC on all devices) -->
    <script>
      (function(){try{const t=localStorage.getItem('theme');const d=t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}const l=localStorage.getItem('scent-language')||'en';document.documentElement.lang=l==='bn'?'bn':'en';}catch(e){}})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SCENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>

<!-- External CSS Link -->
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Hind Siliguri', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: '#D97706',
                        darkBg: '#090D16'
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
        }

        .dark .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
        }
    </style>

</head>
<body class="min-h-screen w-full max-w-[100vw] overflow-x-hidden bg-stone-50 dark:bg-darkBg text-stone-800 dark:text-stone-100 font-sans transition-colors duration-300 flex flex-col justify-between selection:bg-amber-600 selection:text-white">
   <div>

        <!-- ==================== GLOBAL UNIFIED NAVBAR ==================== -->
      <div id="navbar-placeholder"></div>
<!-- Cart Content -->
        <main class="max-w-[1280px] mx-auto px-4 sm:px-6">
            <h2 class="text-2xl font-['Playfair_Display'] font-bold mb-6 text-neutral-900 dark:text-white border-b border-neutral-200 dark:border-neutral-800 pb-3">Your Shopping Cart</h2>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Cart Items List (ডাইনামিক রেন্ডারিং কন্টেইনার) -->
                <div class="lg:col-span-2 space-y-4" id="cart-items-container">
                    <!-- জাভাস্ক্রিপ্ট দিয়ে কার্টের প্রোডাক্টগুলো এখানে স্বয়ংক্রিয়ভাবে লোড হবে -->
                </div>

                <!-- Cart Summary / Checkout Box -->
                <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg p-6 shadow-sm h-fit">
                    <h3 class="font-bold text-sm text-neutral-900 dark:text-white uppercase tracking-wider mb-4 border-b border-neutral-200 dark:border-neutral-800 pb-2">Order Summary</h3>
                    <div class="space-y-2.5 text-xs text-neutral-600 dark:text-neutral-300 mb-6">
                        <div class="flex justify-between">
                            <span>Subtotal</span>
                            <span id="cart-total-price" class="font-semibold text-neutral-900 dark:text-white">৳ 0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Delivery Charge</span>
                            <span class="font-semibold text-neutral-900 dark:text-white">৳ 60</span>
                        </div>
                        <div class="border-t border-neutral-200 dark:border-neutral-800 pt-2.5 flex justify-between text-sm font-bold text-neutral-900 dark:text-white">
                            <span>Grand Total</span>
                            <span id="cart-grand-total" class="text-[#F26522]">৳ 60</span>
                        </div>
                    </div>
                    <button onclick="window.location.href='checkout.html'" class="w-full py-2.5 bg-[#F26522] text-white text-xs font-semibold rounded hover:bg-neutral-800 dark:hover:bg-neutral-700 transition-colors shadow-sm text-center block cursor-pointer">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </main>

    <!-- ==================== GLOBAL FOOTER PLACEHOLDER ==================== -->
    <div id="footer-placeholder"></div>


        <!-- ফায়ারবেস ও অন্যান্য স্ক্রিপ্ট ফাইল -->
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
        <script src="js/db.js"></script>
        <script src="js/slider.js"></script>

        <script src="js/reviews.js"></script>

        <script src="js/cart.js"></script>

        <script src="js/products.js"></script>

        <script src="js/script.js"></script>
        
        <script>
            // পেজ লোড হওয়ার সাথে সাথে লোকালস্টোরেজ থেকে ডাইনামিক কার্ট রেন্ডার করা
            document.addEventListener("DOMContentLoaded", () => {
                if (typeof renderCartPageItems === 'function') {
                    renderCartPageItems();
                }
                if (typeof updateCartBadgeCount === 'function') {
                    updateCartBadgeCount();
                }
            });
        </script>
       <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>

</body>
</html>

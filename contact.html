    <script src="script.js"></script>

    <!-- কন্টাক্ট ফর্ম ডাটা ফায়ারবেসে সেভ করার স্ক্রিপ্ট -->
    <script>
        // যদি আপনার মূল logic কোড (script.js)-এ এই ফাংশনটি আগে থেকেই না থাকে, তবে এটি ব্যবহার করতে পারেন:
        window.handleContactSubmit = async function(e) {
            e.preventDefault();

            const nameInput = e.target.querySelector('input[type="text"]');
            const emailInput = e.target.querySelector('input[type="email"]');
            const messageInput = e.target.querySelector('textarea');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const name = nameInput ? nameInput.value.trim() : '';
            const email = emailInput ? emailInput.value.trim() : '';
            const message = messageInput ? messageInput.value.trim() : '';

            if (!name || !email || !message) {
                alert('Please fill out all fields.');
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Sending...';
            }

            try {
                // ফায়ারবেস কমপ্যাট ভার্সন ব্যবহার করে ডাটা সেভ করা
                await firebase.firestore().collection("messages").add({
                    name: name,
                    email: email,
                    message: message,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Your message has been sent successfully! Thank you. 🚀');
                e.target.reset();
            } catch (error) {
                console.error("Error sending message: ", error);
                alert('Failed to send message. Please try again.');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Submit';
                }
            }
        }
    </script>

    <main class="max-w-[1280px] mx-auto px-4 py-2">
        <!-- Sign In Form Section (Premium Redesign with Social Logins) -->
        <div class="max-w-md mx-auto bg-white border border-neutral-200/80 rounded-2xl p-8 sm:p-10 shadow-xl shadow-neutral-100 my-12 relative overflow-hidden">
            <!-- Decorative Accent Bar -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-amber-500 via-[#F26522] to-orange-400"></div>

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-orange-50 text-[#F26522] mb-3 shadow-inner">
                    <i class="fa-regular fa-user text-lg"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-['Playfair_Display'] font-bold text-neutral-900 tracking-tight">Welcome Back!</h2>
                <p class="text-xs text-neutral-500 mt-1.5 font-medium">Sign in to your account & explore luxury scents</p>
            </div>

            <!-- Firebase Login Form -->
            <form id="login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 mb-1.5">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-400 text-xs">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="admin-email" placeholder="admin@scent.com" required class="w-full pl-9 pr-3 py-2.5 text-xs bg-neutral-50/50 border border-neutral-200 rounded-xl focus:outline-none focus:bg-white focus:border-[#F26522] focus:ring-2 focus:ring-[#F26522]/10 transition-all font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-400 text-xs">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="admin-password" placeholder="••••••••" required class="w-full pl-9 pr-3 py-2.5 text-xs bg-neutral-50/50 border border-neutral-200 rounded-xl focus:outline-none focus:bg-white focus:border-[#F26522] focus:ring-2 focus:ring-[#F26522]/10 transition-all font-medium">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-neutral-600 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="w-3.5 h-3.5 accent-[#F26522] rounded"> Remember me
                    </label>
                    <a href="#" class="font-medium hover:text-[#F26522] transition-colors">Forgot your password?</a>
                </div>

                <button type="submit" class="w-full py-3 bg-[#F26522] hover:bg-neutral-900 text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all duration-300 shadow-md shadow-orange-500/20 cursor-pointer mt-2">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
             
            <div class="text-center mt-6 text-xs text-neutral-600 border-t border-neutral-100 pt-5">
                Don't have an account? <a href="register.html" class="text-[#F26522] font-semibold hover:underline">Register here</a>
            </div>
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-neutral-200"></div>
                <span class="px-3 text-[11px] text-neutral-400 uppercase tracking-wider font-medium">Or continue with</span>
                <div class="flex-grow border-t border-neutral-200"></div>
            </div>

            <!-- Social Login Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="handleGoogleLogin()" class="flex items-center justify-center gap-2 py-2.5 px-4 border border-neutral-200 rounded-xl hover:bg-neutral-50 transition-colors text-xs font-semibold text-neutral-700 cursor-pointer shadow-2xs">
                    <i class="fa-brands fa-google text-red-500"></i> Google
                </button>
                <button type="button" onclick="handleFacebookLogin()" class="flex items-center justify-center gap-2 py-2.5 px-4 border border-neutral-200 rounded-xl hover:bg-neutral-50 transition-colors text-xs font-semibold text-neutral-700 cursor-pointer shadow-2xs">
                    <i class="fa-brands fa-facebook text-blue-600"></i> Facebook

  <!-- Firebase Auth Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6TSzBthiUw_HkKfBc3hkQnw_mQEs8FZU",
            authDomain: "nayan-bc068.firebaseapp.com",
            projectId: "nayan-bc068",
            storageBucket: "nayan-bc068.firebasestorage.app",
            messagingSenderId: "782323259018",
            appId: "1:782323259018:web:a428fe0d96897711223f73",
            measurementId: "G-8PJVBLSPZV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();

        const myRealAdminEmail = "mohibullahnayan.cse@gmail.com";

        // ইমেইল পাসওয়ার্ড লগইন
        window.handleAdminLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                if (email.toLowerCase() === myRealAdminEmail.toLowerCase()) {
                    alert('Welcome, Admin! 🎉');
                    window.location.href = 'admin.html';
                } else {
                    alert('Login successful! 🎉');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                alert('Login failed! Please check your email or password.');
                console.error(error);
            }
        }

        // গুগল দিয়ে লগইন
        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                if (user.email && user.email.toLowerCase() === myRealAdminEmail.toLowerCase()) {
                    alert('Welcome, Admin! 🎉');
                    window.location.href = 'admin.html';
                } else {
                    alert('Google Login successful! 🎉');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                alert('Google Login failed: ' + error.message);
                console.error(error);
            }
        }

        // ফেসবুক দিয়ে লগইন
        window.handleFacebookLogin = async function() {
            try {
                const result = await signInWithPopup(auth, facebookProvider);
                const user = result.user;
                
                if (user.email && user.email.toLowerCase() === myRealAdminEmail.toLowerCase()) {
                    alert('Welcome, Admin! 🎉');
                    window.location.href = 'admin.html';
                } else {
                    alert('Facebook Login successful! 🎉');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                alert('Facebook Login failed: ' + error.message);
                console.error(error);
            }
        }
    </script>

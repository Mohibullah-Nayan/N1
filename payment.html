<!doctype html>
<html lang="bn">
  <head>
    <!-- Instant Theme & Language Auto Sync (Prevents FOUC on all devices) -->
    <script>
      (function(){try{const t=localStorage.getItem('theme');const d=t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}const l=localStorage.getItem('scent-language')||'en';document.documentElement.lang=l==='bn'?'bn':'en';}catch(e){}})();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Gateway - SCENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="db.js"></script>
  </head>
  <body
    class="bg-neutral-100 text-neutral-800 flex items-center justify-center min-h-screen"
  >
    <div
      class="max-w-md w-full bg-white border border-neutral-200 rounded-2xl shadow-md p-6 sm:p-8 m-4"
    >
      <!-- হেডার -->
      <div class="text-center border-b pb-4 mb-6">
        <h1 class="text-2xl font-black tracking-wider text-neutral-900 mb-1">
          SCENT. PAY
        </h1>
        <p class="text-xs text-neutral-500">Secure Online Payment Gateway</p>
        <div
          class="mt-3 bg-neutral-50 p-3 rounded-lg border border-neutral-100"
        >
          <span class="text-xs text-neutral-500 block"
            >Total Payable Amount</span
          >
          <span id="gateway-total" class="text-xl font-bold text-[#F26522]"
            >৳0</span
          >
        </div>
      </div>

      <!-- পেমেন্ট মেথড সিলেকশন -->
      <div class="mb-6">
        <label class="block text-xs font-semibold text-neutral-600 mb-3"
          >Payment Method</label
        >
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            onclick="selectGateway('bkash')"
            id="btn-bkash"
            class="pay-method-btn border-2 border-[#F26522] bg-orange-50/50 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all"
          >
            <span class="font-bold text-sm text-pink-600"> bKash</span>
          </button>
          <button
            type="button"
            onclick="selectGateway('nagad')"
            id="btn-nagad"
            class="pay-method-btn border-2 border-neutral-200 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all"
          >
            <span class="font-bold text-sm text-orange-600">Nagad</span>
          </button>
        </div>
      </div>

      <!-- পেমেন্ট ডিটেইলস ইনপুট ফর্ম -->
      <div id="payment-input-area" class="space-y-4 mb-6">
        <div>
          <label
            id="account-label"
            class="block text-xs font-semibold text-neutral-600 mb-1"
            >bKash Account Number</label
          >
          <input
            type="tel"
            id="gateway-phone"
            class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-sm focus:outline-none focus:border-[#F26522]"
            placeholder="017xxxxxxxx"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-600 mb-1"
            >PIN</label
          >
          <input
            type="password"
            maxlength="5"
            id="gateway-pin"
            class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-sm focus:outline-none focus:border-[#F26522]"
            placeholder="*****"
          />
        </div>
      </div>

      <!-- পেমেন্ট কনফার্ম বাটন -->
      <button
        onclick="processOnlinePayment()"
        class="w-full py-3 bg-[#F26522] text-white text-sm font-semibold rounded-xl hover:bg-neutral-800 transition-colors shadow-sm"
      >
        Confirm Payment
      </button>
    </div>

    <script>
      let selectedGatewayName = "bkash";

      // পেজ লোড হলে লোকালস্টোরেজ থেকে টোটাল অ্যামাউন্ট শো করা
      window.onload = function () {
        let pendingOrder = JSON.parse(localStorage.getItem("pendingOrder"));
        if (!pendingOrder) {
          alert("No order found!");
          window.location.href = "cart.html";
          return;
        }

        // ডিসকাউন্ট সহ ফাইনাল গ্র্যান্ড টোটাল দেখানো
        if (pendingOrder.totalAmount) {
          document.getElementById("gateway-total").innerText = pendingOrder.totalAmount;
        } else {
          let subtotal = (pendingOrder.items || []).reduce((sum, item) => {
            let cleanPrice =
              parseInt(String(item.price).replace(/[^\d]/g, "")) || 0;
            return sum + cleanPrice * item.quantity;
          }, 0);
          let grandTotal = subtotal + 60;
          document.getElementById("gateway-total").innerText =
            "৳" + grandTotal.toLocaleString("en-IN");
        }
      };

      function selectGateway(gateway) {
        selectedGatewayName = gateway;
        let bkashBtn = document.getElementById("btn-bkash");
        let nagadBtn = document.getElementById("btn-nagad");
        let label = document.getElementById("account-label");

        if (gateway === "bkash") {
          bkashBtn.className =
            "pay-method-btn border-2 border-[#F26522] bg-orange-50/50 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all";
          nagadBtn.className =
            "pay-method-btn border-2 border-neutral-200 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all";
          label.innerText = "bKash Account Number";
        } else {
          nagadBtn.className =
            "pay-method-btn border-2 border-[#F26522] bg-orange-50/50 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all";
          bkashBtn.className =
            "pay-method-btn border-2 border-neutral-200 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all";
          label.innerText = "Nagad Account Number";
        }
      }

      async function processOnlinePayment() {
        let phone = document.getElementById("gateway-phone").value.trim();
        let pin = document.getElementById("gateway-pin").value.trim();

        if (!phone || !pin) {
          alert("Please enter your account number and PIN.");
          return;
        }

        if (pin.length < 4) {
          alert("Please enter a valid PIN.");
          return;
        }

        let pendingOrder = JSON.parse(localStorage.getItem("pendingOrder"));
        if (!pendingOrder) {
          alert("Session expired or order not found!");
          window.location.href = "index.html";
          return;
        }

        const gatewayTag = selectedGatewayName.toUpperCase();
        pendingOrder.paymentStatus = "Paid (" + gatewayTag + ")";
        pendingOrder.paymentMethod = "online (" + gatewayTag + ")";

        // Firebase Firestore-এ পেমেন্ট স্ট্যাটাস আপডেট করা
        if (typeof firebase !== 'undefined' && firebase.firestore) {
          try {
            const db = firebase.firestore();
            const snap = await db.collection("orders").where("orderId", "==", pendingOrder.orderId).get();
            if (!snap.empty) {
              snap.forEach(async (doc) => {
                await doc.ref.update({
                  paymentStatus: "Paid (" + gatewayTag + ")",
                  paymentMethod: "online (" + gatewayTag + ")",
                  paidAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              });
            }
          } catch (e) {
            console.warn("Could not sync online payment status to Firebase:", e);
          }
        }

        // লোকালস্টোরেজ ব্যাকআপ আপডেট ও ক্লিনআপ
        let allOrders = JSON.parse(localStorage.getItem("orders")) || [];
        allOrders.push(pendingOrder);
        localStorage.setItem("orders", JSON.stringify(allOrders));

        localStorage.removeItem("pendingOrder");
        for (let i = 0; i < localStorage.length; i++) {
          let k = localStorage.key(i);
          if (k && k.startsWith("nayan_cart_")) {
            localStorage.removeItem(k);
          }
        }

        alert(`Payment successful via ${gatewayTag}! Order ID: ${pendingOrder.orderId}`);
        window.location.href = `track-order.html?id=${encodeURIComponent(pendingOrder.orderId)}`;
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- Instant Theme & Language Auto Sync (Prevents FOUC on all devices) -->
    <script>
      (function(){try{const t=localStorage.getItem('theme');const d=t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}const l=localStorage.getItem('scent-language')||'en';document.documentElement.lang=l==='bn'?'bn':'en';}catch(e){}})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SCENT</title>
         <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>

<!-- External CSS Link -->
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Hind Siliguri', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: '#D97706',
                        darkBg: '#090D16'
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
        }

        .dark .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
        }
    </style>

</head>
<body class="min-h-screen w-full max-w-[100vw] overflow-x-hidden bg-stone-50 dark:bg-darkBg text-stone-800 dark:text-stone-100 font-sans transition-colors duration-300 flex flex-col justify-between selection:bg-amber-600 selection:text-white">
   <div>

        <!-- ==================== GLOBAL UNIFIED NAVBAR ==================== -->
      <div id="navbar-placeholder"></div>
    <main class="flex-1 w-full max-w-[100vw] overflow-x-hidden">

        <!-- Registration Form Section -->
        <div class="max-w-md mx-auto bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-lg p-8 shadow-sm my-12">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-['Playfair_Display'] font-bold text-neutral-900 dark:text-white">Create New Account</h2>
                <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">Provide your information to join us</p>
            </div>

            <form onsubmit="handleRegister(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Full Name</label>
                    <input type="text" id="register-name" placeholder="Enter your full name" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Email Address</label>
                    <input type="email" id="register-email" placeholder="example@gmail.com" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Phone Number</label>
                    <input type="tel" id="register-phone" placeholder="01XXXXXXXXX" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522]">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Gender</label>
                        <select id="register-gender" class="w-full px-3 py-2 text-xs border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522] bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Date of Birth (Optional)</label>
                        <input type="date" id="register-dob" class="w-full px-3 py-2 text-xs border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522] bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-200">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Shipping Address</label>
                    <textarea id="register-address" placeholder="House Number, Road, Area, Thana/City" rows="2" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522] resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Password</label>
                    <input type="password" id="register-password" placeholder="At least 6 characters" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-neutral-700 dark:text-neutral-300 mb-1">Confirm Password</label>
                    <input type="password" id="register-confirm-password" placeholder="Re-enter your password" required class="w-full px-3 py-2 text-xs bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-700 rounded focus:outline-none focus:border-[#F26522]">
                </div>

                <!-- Terms and Conditions Checkbox -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="terms-check" required class="w-3.5 h-3.5 accent-[#F26522] cursor-pointer">
                    <label for="terms-check" class="text-[11px] text-neutral-600 dark:text-neutral-400 cursor-pointer">
                        I agree to the <a href="#" class="text-[#F26522] hover:underline">Terms and Conditions</a> and <a href="#" class="text-[#F26522] hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="w-full py-2.5 bg-[#F26522] text-white text-xs font-semibold rounded hover:bg-neutral-800 dark:hover:bg-neutral-700 transition-colors shadow-sm mt-2">
                    Register
                </button>
            </form>

            <div class="text-center mt-6 text-xs text-neutral-600 dark:text-neutral-400 border-t border-neutral-100 dark:border-neutral-800 pt-4">
                Already have an account? <a href="login.html" class="text-[#F26522] font-semibold hover:underline">Sign in</a>
            </div>
        </div>
    </main>

   
        <!-- ==================== GLOBAL FOOTER PLACEHOLDER ==================== -->
    <div id="footer-placeholder"></div>

    <script src="js/slider.js"></script>

    <script src="js/reviews.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/products.js"></script>

    <script src="js/script.js"></script>
    <script src="js/register.js"></script>
   <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>

</body>
</html>

<!doctype html>
<html lang="bn">
  <head>
    <!-- Instant Theme & Language Auto Sync (Prevents FOUC on all devices) -->
    <script>
      (function(){try{const t=localStorage.getItem('theme');const d=t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.classList.remove('dark');document.documentElement.setAttribute('data-theme','light');}const l=localStorage.getItem('scent-language')||'en';document.documentElement.lang=l==='bn'?'bn':'en';}catch(e){}})();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Gateway - SCENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/db.js"></script>
</head>
  <body
    class="bg-neutral-100 text-neutral-800 flex items-center justify-center min-h-screen"
  >
    <div
      class="max-w-md w-full bg-white border border-neutral-200 rounded-2xl shadow-md p-6 sm:p-8 m-4"
    >
      <!-- হেডার -->
      <div class="text-center border-b pb-4 mb-6">
        <h1 class="text-2xl font-black tracking-wider text-neutral-900 mb-1">
          SCENT. PAY
        </h1>
        <p class="text-xs text-neutral-500">Secure Online Payment Gateway</p>
        <div
          class="mt-3 bg-neutral-50 p-3 rounded-lg border border-neutral-100"
        >
          <span class="text-xs text-neutral-500 block"
            >Total Payable Amount</span
          >
          <span id="gateway-total" class="text-xl font-bold text-[#F26522]"
            >৳0</span
          >
        </div>
      </div>

      <!-- পেমেন্ট মেথড সিলেকশন -->
      <div class="mb-6">
        <label class="block text-xs font-semibold text-neutral-600 mb-3"
          >Payment Method</label
        >
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            onclick="selectGateway('bkash')"
            id="btn-bkash"
            class="pay-method-btn border-2 border-[#F26522] bg-orange-50/50 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all"
          >
            <span class="font-bold text-sm text-pink-600"> bKash</span>
          </button>
          <button
            type="button"
            onclick="selectGateway('nagad')"
            id="btn-nagad"
            class="pay-method-btn border-2 border-neutral-200 p-3 rounded-xl flex flex-col items-center justify-center gap-2 transition-all"
          >
            <span class="font-bold text-sm text-orange-600">Nagad</span>
          </button>
        </div>
      </div>

      <!-- পেমেন্ট ডিটেইলস ইনপুট ফর্ম -->
      <div id="payment-input-area" class="space-y-4 mb-6">
        <div>
          <label
            id="account-label"
            class="block text-xs font-semibold text-neutral-600 mb-1"
            >bKash Account Number</label
          >
          <input
            type="tel"
            id="gateway-phone"
            class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-sm focus:outline-none focus:border-[#F26522]"
            placeholder="017xxxxxxxx"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-600 mb-1"
            >PIN</label
          >
          <input
            type="password"
            maxlength="5"
            id="gateway-pin"
            class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-sm focus:outline-none focus:border-[#F26522]"
            placeholder="*****"
          />
        </div>
      </div>

      <!-- পেমেন্ট কনফার্ম বাটন -->
      <button
        onclick="processOnlinePayment()"
        class="w-full py-3 bg-[#F26522] text-white text-sm font-semibold rounded-xl hover:bg-neutral-800 transition-colors shadow-sm"
      >
        Confirm Payment
      </button>
    </div>

    <script src="js/payment.js"></script>
  </body>
</html>
